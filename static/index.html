<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="version" content="{{VERSION}}">
  <title>Yerel Asistan</title>
  <link rel="stylesheet" href="/static/style.css?v={{VERSION}}">
</head>
<body>
  <div class="app">
    <aside class="sidebar" id="sidebar">
      <button id="new-chat" class="primary wide">+ Yeni sohbet</button>
      <nav id="conversations" class="conversations"></nav>
      <div class="sidebar-footer">
        <button id="open-memory" class="ghost wide">🧠 Hafıza</button>
        <button id="open-settings" class="ghost wide">⚙️ Ayarlar</button>
        <button id="config-summary" class="summary" title="Ayarları aç"></button>
        <p class="version">Sürüm {{VERSION}}</p>
      </div>
    </aside>

    <main class="chat">
      <header class="chat-header">
        <button id="toggle-sidebar" class="icon" title="Menü">☰</button>
        <h1 id="chat-title">Yeni sohbet</h1>
        <label class="toggle" title="Yanıtları sesli oku">
          <input type="checkbox" id="speak-toggle"> 🔊 Sesli yanıt
        </label>
      </header>

      <section id="messages" class="messages">
        <div id="empty" class="empty">
          <div class="empty-icon">✨</div>
          <h2 id="greeting">Merhaba!</h2>
          <p>Yaz ya da 🎤 butonuna basıp konuş. Söylediklerini hatırlarım.</p>
        </div>
      </section>

      <div id="status" class="status" hidden></div>

      <form id="composer" class="composer">
        <button type="button" id="mic" class="icon mic" title="Konuşmak için bas, bitirince tekrar bas">🎤</button>
        <textarea id="input" rows="1" placeholder="Mesajını yaz..." autofocus></textarea>
        <button type="submit" id="send" class="primary">Gönder</button>
      </form>
    </main>
  </div>

  <dialog id="memory-dialog">
    <div class="dialog-head">
      <h2>🧠 Hafıza</h2>
      <button class="icon close" data-close>✕</button>
    </div>
    <p class="hint">Asistan sohbetlerden önemli bilgileri kendiliğinden buraya kaydeder ve her yeni sohbette bunları bilir. Yanlış olanları silebilir, kendin de ekleyebilirsin.</p>
    <form id="memory-form" class="row">
      <input id="memory-input" placeholder="Örn: Kızımın adı Elif, 3 Mayıs'ta doğdu.">
      <button class="primary">Ekle</button>
    </form>
    <p id="memory-status" class="hint"></p>
    <ul id="memory-list" class="memory-list"></ul>
  </dialog>

  <dialog id="settings-dialog">
    <div class="dialog-head">
      <h2>⚙️ Ayarlar</h2>
      <button class="icon close" data-close>✕</button>
    </div>
    <form id="settings-form" class="settings">
      <label>Asistanın adı
        <input name="assistant_name">
      </label>
      <label>Yapay zekâ modeli (Ollama)
        <select name="model"></select>
        <small id="models-hint"></small>
      </label>
      <label>Hafıza modeli
        <select name="memory_model"></select>
        <small>Senin hakkındaki bilgileri arka planda, sen beklemezken çıkarır. Sohbet modelinden daha akıllı (daha yavaş) bir model seçmek hafızanın kalitesini artırır.</small>
      </label>
      <label>Ses tanıma kalitesi
        <select name="whisper_model">
          <option value="tiny">En hızlı (tiny) — daha az doğru</option>
          <option value="base">Hızlı (base)</option>
          <option value="small">Dengeli (small) — önerilen</option>
          <option value="medium">İyi (medium) — işlemcide yavaş</option>
          <option value="large-v3-turbo">En iyi (large-v3-turbo) — ekran kartı önerilir</option>
        </select>
      </label>
      <label>Ses tanıma donanımı
        <select name="whisper_device">
          <option value="auto">Otomatik — NVIDIA ekran kartı varsa onu kullanır</option>
          <option value="cpu">Sadece işlemci</option>
        </select>
      </label>
      <label>Yanıt sesi
        <select name="tts_voice">
          <option value="tr-TR-EmelNeural">Emel — kadın, çok doğal (çevrimiçi)</option>
          <option value="tr-TR-AhmetNeural">Ahmet — erkek, çok doğal (çevrimiçi)</option>
          <option value="windows">Windows sesi — internetsiz</option>
        </select>
        <small>Çevrimiçi seslerde yalnızca okunacak yanıt Microsoft'a gönderilir; mesajların ve hafızan bilgisayarında kalır.</small>
      </label>
      <label class="check">
        <input type="checkbox" name="auto_listen">
        Sesli sohbet: yanıt okununca mikrofonu kendiliğinden tekrar aç
      </label>
      <label>Konuşma dili
        <select name="language">
          <option value="tr">Türkçe</option>
          <option value="en">English</option>
          <option value="">Otomatik algıla</option>
        </select>
      </label>
      <button class="primary">Kaydet</button>
    </form>
  </dialog>

  <script src="/static/app.js?v={{VERSION}}"></script>
</body>
</html>
